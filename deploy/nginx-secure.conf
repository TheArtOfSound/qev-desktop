# nginx vhost for secure.imagineqira.com — mirrors the LIVE config
# on the production server (synced 2026-06-10).
#
# ── Security headers added 2026-07-29 in response to the client audit
#    (findings F-01 CSP, F-10 missing headers, F-20 duplicate content).
#
#    THIS FILE IS A MIRROR ONLY. Nothing below takes effect until the
#    same change is applied to the live server and reloaded:
#        nginx -t && systemctl reload nginx
#    Until that reload happens, F-01 and F-10 remain OPEN in production
#    and the /vault "connect-src 'none'" promise is still unenforced.
#
# ── WHY THE HEADER BLOCK IS REPEATED IN EVERY location {}
#
#    nginx's add_header is NOT cumulative across levels: a location
#    inherits add_header from its parent ONLY IF that location defines
#    no add_header of its own. The moment a location sets one header it
#    silently drops every inherited one. Two locations here already set
#    `add_header Cache-Control ...`, so a server-level-only header block
#    would have applied to some URLs and not others — the single most
#    common way this change fails silently.
#
#    So: the block is declared at server level (for locations that set
#    no add_header at all) AND repeated verbatim inside every location
#    that sets any add_header. `always` is used so the headers are also
#    sent on 301/302/403/404 responses, not just 2xx/3xx.
#
#    If you add an add_header to ANY location in this file, you MUST
#    copy the matching header block into it too. Follow-up worth doing:
#    move the two blocks into /etc/nginx/snippets/ and `include` them;
#    kept inline here so this file stays droppable-in as-is.
#
# Notes:
#  - try_files puts $uri.html BEFORE $uri/ so /downloads serves the
#    downloads.html page instead of 301-ing into the downloads/
#    binaries directory.
#  - /downloads/ and /challenge/ also serve their pages directly:
#    browsers cached the old 301-to-403 permanent redirects.
#  - HTML is no-cache so stale pages/redirects can't stick.
#  - No sub_filter/GA injection here: analytics are inline in the
#    signed HTML so served bytes match site-integrity.json.

server {
    server_name secure.imagineqira.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /var/www/secure-imagineqira;
    index index.html;

    # ── BASELINE SECURITY HEADERS (F-10) ──────────────────────────────
    #
    # HSTS is 1 year + includeSubDomains. `preload` is deliberately NOT
    # set: submission to the browser preload list is a public, slow-to-
    # reverse commitment for every subdomain, so it needs an explicit
    # operator decision rather than an audit fix.
    #
    # CSP composition — measured against the actual pages, not assumed:
    #   script-src  'self' + 'unsafe-inline'. NO third-party hosts.
    #     'unsafe-inline' is required today because real page logic
    #     lives in inline <script> blocks: the index countdown and FAQ
    #     accordion, the /challenge UTC formatter, and — importantly —
    #     the /verify page's own integrity-record renderer. Dropping it
    #     would break /verify, the page the audit cares most about.
    #     TO TIGHTEN FURTHER: move those inline blocks into files under
    #     /, re-sign, then reduce this to `script-src 'self'`. Do not
    #     tighten it here first — it would silently break the pages.
    #   style-src   'unsafe-inline' is required: every page carries
    #     inline style="" attributes, and site-verify.js injects its
    #     banners with inline style attributes via innerHTML.
    #   connect-src 'self' only. /notify needs 'self' (its fetches are
    #     built from window.location.origin), and /verify fetches
    #     /site-integrity.json. No third-party endpoint is permitted.
    #
    #   NOTE ON ANALYTICS: 10 landing pages previously carried a GA4
    #   tag (G-XV71TRRR8Z) in the repo, while the deployed site served
    #   none and the Privacy Policy promised "no analytics". That
    #   contradiction was resolved by REMOVING the tags, so repo,
    #   production and the Privacy Policy now agree. If analytics are
    #   ever reintroduced, this CSP and /privacy must change together
    #   in the same commit.
    #   img-src, object-src, base-uri, frame-ancestors, form-action:
    #     no page has an <img>, <iframe>, <object> or <base>, and the
    #     only <form>s on the site are the JS-handled vault forms, so
    #     these can all be locked down with no functional loss.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location ~* \.(js|css|svg|woff2|woff|ttf|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";

        # Repeated because this location sets add_header (see top).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }

    location = /app/ {
        return 302 /vault/;
    }
    location = /app {
        return 302 /vault/;
    }
    location /app/ {
        return 302 /vault/;
    }

    # ── STRICT CSP FOR THE VAULT (F-01) ───────────────────────────────
    #
    # /vault tells the user, in the page copy, that it runs under
    # `connect-src 'none'` so nothing they type can leave the tab. Until
    # this block existed there was NO CSP on the site at all and that
    # sentence was simply false. These headers are what make it true and
    # browser-enforced.
    #
    # connect-src 'none' blocks fetch/XHR/WebSocket/EventSource/beacon
    # including SAME-ORIGIN ones, so it was checked against every script
    # the page loads:
    #   - chat.js   — no fetch/XHR/WebSocket/sendBeacon at all. Its two
    #                 URL.createObjectURL uses are `a[download]` saves
    #                 (recovery sheet, vault file), which CSP fetch
    #                 directives do not govern, so downloads still work.
    #   - sodium.js — libsodium.js 0.7.13 asm.js sumo build; contains no
    #                 .wasm filename and no streaming instantiate, so it
    #                 pulls nothing over the network.
    #   - site-verify.js — already lists "/vault" in STRICT_CSP_PREFIXES
    #                 and skips its manifest fetch here by design,
    #                 showing the "integrity check skipped (strict CSP)"
    #                 notice instead. So this CSP does not break the
    #                 tamper-evidence banner; the script anticipated it.
    # script-src stays 'self': the vault has no inline <script>, it loads
    # sodium.js, chat.js and site-verify.js by src with SRI. The SRI
    # requests use crossorigin=anonymous, but script loads answer to
    # script-src, not connect-src, so 'none' does not affect them.
    # style-src keeps 'unsafe-inline' (one <style> block, 10 inline
    # style="" attributes, plus site-verify.js's injected notice).
    # form-action 'none' is a bonus safety net here: both vault forms are
    # JS-handled with preventDefault, so blocking submission means a JS
    # error can never POST a passphrase to the server.
    #
    # Coverage: every reachable spelling of the vault URL must get this
    # policy, or the promise is only true on one of them. `= /vault` and
    # `= /vault/` are exact matches (highest priority). `^~ /vault/`
    # covers everything else under /vault/, and the `^~` matters: it
    # stops the server-level `\.html$` regex from stealing a future
    # /vault/*.html sub-page and serving it with the weaker baseline CSP.
    # Because `^~` also suppresses the asset regex, the caching rule is
    # re-declared as a nested location inside it.
    location = /vault {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        try_files /vault/index.html =404;
    }

    # /vault is the canonical spelling (it is what sitemap.xml lists).
    # /vault/ keeps serving 200 rather than 301-ing, for the same cached
    # -redirect reason documented for /downloads below; the rel=canonical
    # Link header is what de-duplicates the two for crawlers.
    location = /vault/ {
        add_header Cache-Control "no-cache" always;
        add_header Link "<https://secure.imagineqira.com/vault>; rel=\"canonical\"" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        try_files /vault/index.html =404;
    }

    location ^~ /vault/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

        # Re-declared because `^~` above suppresses the server-level
        # asset regex, and again because this nested location sets its
        # own add_header (sodium.js is 1 MB — it needs the 7d cache).
        location ~* \.(js|css|svg|woff2|woff|ttf|png|jpg|jpeg|webp|ico)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        }

        try_files $uri $uri.html $uri/ =404;
    }

    # Cached-301 rescue: until 2026-06-10, /downloads and /challenge
    # 301d into their sibling directories (no index file -> 403), and
    # browsers cache permanent redirects. Serving the pages at the
    # directory URLs too means those cached redirects land on the
    # real page instead of a 403.
    #
    # ── F-20 duplicate content, and why this is NOT a 301 ─────────────
    #
    # /downloads and /downloads/ both returned 200 with identical bytes.
    # The canonical URL is the SLASHLESS one, /downloads — that is what
    # sitemap.xml lists, what every internal link uses, and (decisively)
    # the only spelling site-verify.js can integrity-check: it maps
    # "/downloads" to manifest key "downloads.html", which exists, while
    # "/downloads/" maps to "downloads/index.html", which is not in
    # site-integrity.json. On /downloads/ the verifier therefore finds no
    # entry and silently skips the page-hash check. Making the slashed
    # form canonical would quietly disable tamper detection on the page.
    #
    # The obvious fix — 301 /downloads/ -> /downloads — MUST NOT be used.
    # Browsers still hold the pre-2026-06-10 cached PERMANENT redirect
    # /downloads -> /downloads/. For those clients the request for
    # /downloads never reaches us; the cache answers /downloads/, we 301
    # back to /downloads, the cache answers /downloads/ again, forever:
    # ERR_TOO_MANY_REDIRECTS. A 302 loops identically — the loop comes
    # from the cached entry, not from our status code, and there is no
    # server-side way to invalidate a redirect the browser never re-asks
    # about. That is exactly the failure the rescue below prevents.
    #
    # Tradeoff taken: keep serving 200 at the directory URLs (rescue
    # preserved, no loop) and de-duplicate for crawlers with a
    # rel="canonical" Link header instead of a redirect. Search engines
    # honour it; the cached-301 clients still land on a real page. The
    # 301 becomes safe to adopt only once the old cached redirects have
    # aged out of the field, and it is not worth the risk for a
    # crawler-only concern.
    #
    # Cache-Control no-cache is added here too: these blocks serve HTML
    # but bypass the \.html$ location below, so they were the one gap in
    # the "HTML always revalidates" rule.
    location = /downloads/ {
        add_header Cache-Control "no-cache" always;
        add_header Link "<https://secure.imagineqira.com/downloads>; rel=\"canonical\"" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        try_files /downloads.html =404;
    }
    location = /challenge/ {
        add_header Cache-Control "no-cache" always;
        add_header Link "<https://secure.imagineqira.com/challenge>; rel=\"canonical\"" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        try_files /challenge.html =404;
    }

    # Signed-site hygiene: HTML must always revalidate so visitors
    # never hold stale pages (or stale redirects) that drift from
    # site-integrity.json.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;

        # Repeated because this location sets add_header (see top).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pti.imagineqira.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pti.imagineqira.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
# Plaintext vhost. No security headers are set here on purpose: RFC 6797
# §7.2 requires browsers to IGNORE Strict-Transport-Security received
# over non-secure transport, and the only responses this block produces
# are a redirect to https and a 404, so a CSP here would protect nothing.
server {
    if ($host = secure.imagineqira.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name secure.imagineqira.com;
    return 404; # managed by Certbot


}