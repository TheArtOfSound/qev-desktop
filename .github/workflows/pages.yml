name: Deploy QEV Pages

# Single source of truth for the GitHub Pages site:
#   /          — the QEV app (built fresh from proof-lock-web/);
#                #/tool, #/start etc. are its routes
#   /app/      — redirect to / (links shipped 2026-06-10 only)
#   /docs/     — markdown docs + redirect for old /docs/ SPA links
#   /assets/   — shared static assets
# (An earlier setup had two separate apps and two workflows racing to
# deploy different payloads to the same Pages environment; whichever
# ran last won, which intermittently broke …/#/tool links.)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qev-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proof-lock-web/package-lock.json

      - name: Build guide app
        working-directory: proof-lock-web
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R proof-lock-web/dist/* _site/
          cp 404.html _site/404.html
          cp -R docs _site/docs
          mkdir -p _site/app
          cp app-redirect.html _site/app/index.html
          if [ -d assets ]; then mkdir -p _site/assets && cp -R assets/. _site/assets/; fi
          cp robots.txt _site/robots.txt
          touch _site/.nojekyll

          # This Pages build is UNSIGNED: no Subresource Integrity on its
          # scripts, and outside the Ed25519 manifest that covers
          # secure.imagineqira.com. The 2026-07-29 audit flagged it as a
          # second, unverifiable copy of a security tool competing with
          # the canonical site for the brand.
          #
          # Injected at assembly time so nothing in proof-lock-web/ has to
          # know it is being mirrored: noindex (so it stops competing in
          # search) plus a canonical pointing at the signed site. Bookmarks
          # keep working; nothing is redirected away. robots.txt stays
          # crawlable on purpose so the noindex is actually seen.
          for f in _site/index.html _site/404.html; do
            [ -f "$f" ] || continue
            # `grep -q ... && continue` would exit 1 on no-match and, under
            # the default `bash -e`, fail the whole step. Use an if-block.
            if grep -q 'name="robots"' "$f"; then continue; fi
            sed -i 's#</head>#<meta name="robots" content="noindex,follow"><link rel="canonical" href="https://secure.imagineqira.com/vault"></head>#I' "$f"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
